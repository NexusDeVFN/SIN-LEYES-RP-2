$engine: 3
$onesync: 'on'
name: SIN LEYES RP 2.0 - NX-Core
version: 0.2.1
author: NX Development
description: Framework propio NX-Core, base SQL y recursos FiveM mediante txAdmin.
tasks:
- action: connect_database
- action: ensure_dir
  path: ./resources
- action: download_github
  src: citizenfx/cfx-server-data
  ref: master
  subpath: resources
  dest: ./resources
- action: ensure_dir
  path: ./tmp
- action: download_file
  url: https://github.com/overextended/oxmysql/releases/latest/download/oxmysql.zip
  path: ./tmp/oxmysql.zip
- action: unzip
  src: ./tmp/oxmysql.zip
  dest: ./resources
- action: remove_path
  path: ./tmp/oxmysql.zip
- action: write_file
  file: ./resources/nx-core/client/main.lua
  data: |
    local loaded = false
    local data = nil
    RegisterNetEvent('nx-core:client:playerData', function(payload)
        data = payload
        if loaded then print(('[NX-Core] %s %s | Efectivo $%s | Banco $%s'):format(data.firstname,data.lastname,data.cash,data.bank)) end
    end)
    RegisterNetEvent('nx-core:client:spawn', function(pos)
        if loaded then return end
        local model = joaat('mp_m_freemode_01')
        RequestModel(model)
        local tries=0
        while not HasModelLoaded(model) and tries<100 do Wait(100) tries=tries+1 end
        if not HasModelLoaded(model) then print('[NX-Core] Error cargando modelo') return end
        SetPlayerModel(PlayerId(), model)
        SetModelAsNoLongerNeeded(model)
        RequestCollisionAtCoord(pos.x,pos.y,pos.z)
        SetEntityCoordsNoOffset(PlayerPedId(),pos.x,pos.y,pos.z,false,false,false)
        SetEntityHeading(PlayerPedId(),pos.w or 0.0)
        NetworkResurrectLocalPlayer(pos.x,pos.y,pos.z,pos.w or 0.0,true,false)
        ClearPedTasksImmediately(PlayerPedId())
        ShutdownLoadingScreen()
        ShutdownLoadingScreenNui()
        DoScreenFadeIn(700)
        loaded=true
        if data then print('[NX-Core] Bienvenido, '..data.firstname) end
    end)
    CreateThread(function()
        while not NetworkIsSessionStarted() do Wait(500) end
        Wait(1500)
        TriggerServerEvent('nx-core:server:ready')
        while true do
            Wait(60000)
            if loaded then
                local ped=PlayerPedId()
                local c=GetEntityCoords(ped)
                TriggerServerEvent('nx-core:server:savePosition', {x=c.x,y=c.y,z=c.z,w=GetEntityHeading(ped)})
            end
        end
    end)
    RegisterCommand('miperfil', function()
        if data then
            TriggerEvent('chat:addMessage',{args={'NX-Core', ('ID %s | %s %s | Efectivo $%s | Banco $%s | Trabajo %s'):format(data.id,data.firstname,data.lastname,data.cash,data.bank,data.job)}})
        end
    end, false)
    exports('GetPlayerData', function() return data end)
- action: write_file
  file: ./resources/nx-core/fxmanifest.lua
  data: |
    fx_version 'cerulean'
    game 'gta5'
    lua54 'yes'
    author 'NX-Core'
    description 'SIN LEYES RP 2.0 - Framework core MVP'
    version '0.1.0'
    shared_scripts {'shared/config.lua'}
    server_scripts {'@oxmysql/lib/MySQL.lua','server/main.lua'}
    client_scripts {'client/main.lua'}
    dependency 'oxmysql'
- action: write_file
  file: ./resources/nx-core/server/main.lua
  data: |
    local Players = {}
    local function getLicense(src)
        for _, identifier in ipairs(GetPlayerIdentifiers(src)) do
            if identifier:sub(1, 8) == 'license:' then return identifier end
        end
    end
    local function validAmount(amount)
        return type(amount) == 'number' and amount == math.floor(amount) and amount > 0 and amount <= 100000000
    end
    local function sync(src)
        local p = Players[src]
        if p then TriggerClientEvent('nx-core:client:playerData', src, {id=p.id, firstname=p.firstname, lastname=p.lastname, cash=p.cash, bank=p.bank, job=p.job, job_grade=p.job_grade}) end
    end
    local function loadPlayer(src)
        if not GetPlayerName(src) then return end
        local license = getLicense(src)
        if not license then DropPlayer(src, 'No se encontró tu licencia de Rockstar.') return end
        local rows = MySQL.query.await('SELECT * FROM nx_players WHERE license = ? LIMIT 1', {license})
        local p = rows[1]
        if not p then
            MySQL.insert.await('INSERT IGNORE INTO nx_players (license, cash, bank) VALUES (?, ?, ?)', {license, Config.StartingCash, Config.StartingBank})
            rows = MySQL.query.await('SELECT * FROM nx_players WHERE license = ? LIMIT 1', {license})
            p = rows[1]
        end
        if not p or not GetPlayerName(src) then return end
        Players[src] = p
        sync(src)
        local pos
        if p.position then
            local ok, decoded = pcall(json.decode, p.position)
            if ok and type(decoded) == 'table' and type(decoded.x)=='number' and type(decoded.y)=='number' and type(decoded.z)=='number' then pos = decoded end
        end
        TriggerClientEvent('nx-core:client:spawn', src, pos or {x=Config.DefaultSpawn.x,y=Config.DefaultSpawn.y,z=Config.DefaultSpawn.z,w=Config.DefaultSpawn.w})
        print(('[NX-Core] Cargado %s (%s)'):format(GetPlayerName(src), src))
    end
    local function savePlayer(src)
        local p = Players[src]
        if not p then return end
        MySQL.update.await('UPDATE nx_players SET firstname=?, lastname=?, cash=?, bank=?, job=?, job_grade=?, position=? WHERE id=?',
            {p.firstname,p.lastname,p.cash,p.bank,p.job,p.job_grade,p.position,p.id})
    end
    exports('GetPlayer', function(src) return Players[src] end)
    exports('GetPlayers', function() return Players end)
    exports('AddMoney', function(src, account, amount, reason)
        local p=Players[src]
        if not p or (account~='cash' and account~='bank') or not validAmount(amount) or p[account]+amount>2147483647 then return false end
        local affected=MySQL.update.await(('UPDATE nx_players SET %s = %s + ? WHERE id = ? AND %s <= ?'):format(account,account,account), {amount,p.id,2147483647-amount})
        if affected~=1 then return false end
        p[account]=p[account]+amount
        MySQL.insert.await('INSERT INTO nx_transactions (player_id, account, amount, reason) VALUES (?, ?, ?, ?)', {p.id,account,amount,tostring(reason or 'Sin motivo'):sub(1,100)})
        sync(src)
        return true
    end)
    exports('RemoveMoney', function(src, account, amount, reason)
        local p=Players[src]
        if not p or (account~='cash' and account~='bank') or not validAmount(amount) or p[account]<amount then return false end
        local affected=MySQL.update.await(('UPDATE nx_players SET %s = %s - ? WHERE id = ? AND %s >= ?'):format(account,account,account), {amount,p.id,amount})
        if affected~=1 then return false end
        p[account]=p[account]-amount
        MySQL.insert.await('INSERT INTO nx_transactions (player_id, account, amount, reason) VALUES (?, ?, ?, ?)', {p.id,account,-amount,tostring(reason or 'Sin motivo'):sub(1,100)})
        sync(src)
        return true
    end)
    RegisterNetEvent('nx-core:server:ready', function() local src=source if not Players[src] then loadPlayer(src) else sync(src) end end)
    RegisterNetEvent('nx-core:server:savePosition', function(pos)
        local src=source
        if not Players[src] or type(pos)~='table' then return end
        for _, key in ipairs({'x','y','z','w'}) do if type(pos[key])~='number' or pos[key]~=pos[key] or math.abs(pos[key])>100000 then return end end
        Players[src].position=json.encode({x=pos.x,y=pos.y,z=pos.z,w=pos.w})
    end)
    AddEventHandler('playerDropped', function() local src=source if Players[src] then savePlayer(src) Players[src]=nil end end)
    CreateThread(function() while true do Wait(Config.SaveInterval) for src in pairs(Players) do savePlayer(src) end end end)
    AddEventHandler('onResourceStop', function(name) if name~=GetCurrentResourceName() then return end for src in pairs(Players) do savePlayer(src) end end)
    RegisterCommand('nxstatus', function(src)
        if src==0 then print('[NX-Core] Jugadores cargados: '..tostring(#GetPlayers())) return end
        sync(src)
    end, false)
- action: write_file
  file: ./resources/nx-core/shared/config.lua
  data: |
    Config = {}
    Config.StartingCash = 500
    Config.StartingBank = 2500
    Config.DefaultSpawn = vector4(-1037.71, -2737.88, 20.17, 329.0)
    Config.SaveInterval = 120000
    Config.MaxNameLength = 40
- action: write_file
  file: ./database/install.sql
  data: |
    CREATE TABLE IF NOT EXISTS nx_players (
     id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
     license VARCHAR(80) NOT NULL UNIQUE,
     firstname VARCHAR(40) NOT NULL DEFAULT 'Ciudadano',
     lastname VARCHAR(40) NOT NULL DEFAULT 'Nuevo',
     cash INT UNSIGNED NOT NULL DEFAULT 500,
     bank INT UNSIGNED NOT NULL DEFAULT 2500,
     job VARCHAR(50) NOT NULL DEFAULT 'unemployed',
     job_grade INT UNSIGNED NOT NULL DEFAULT 0,
     position LONGTEXT NULL,
     created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
     updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB;
    CREATE TABLE IF NOT EXISTS nx_transactions (
     id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
     player_id BIGINT UNSIGNED NOT NULL,
     account ENUM('cash','bank') NOT NULL,
     amount BIGINT NOT NULL,
     reason VARCHAR(100) NOT NULL,
     created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
     INDEX (player_id),
     CONSTRAINT fk_nx_transactions_player FOREIGN KEY (player_id) REFERENCES nx_players(id) ON DELETE CASCADE
    ) ENGINE=InnoDB;
- action: query_database
  file: ./database/install.sql
- action: write_file
  file: ./server.cfg
  data: |
    # NX-Core v0.2 - txAdmin Server Deployer
    # La identidad publica se administra desde Cfx Portal.
    {{serverEndpoints}}
    sv_maxclients {{maxClients}}
    sv_licenseKey "{{svLicense}}"
    sv_enforceGameBuild 3751
    set onesync on
    set steam_webApiKey "none"
    set resources_useSystemChat true
    set mysql_connection_string "{{dbConnectionString}}"

    # Permisos de txAdmin
    add_ace group.admin command allow
    add_ace group.admin command.quit deny
    {{addPrincipalsMaster}}

    # Recursos de FiveM y NX-Core
    ensure mapmanager
    ensure chat
    ensure hardcap
    ensure oxmysql
    ensure nx-core
